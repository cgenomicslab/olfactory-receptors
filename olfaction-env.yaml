# One environment runs everything in the repository except the command-line tree tools
# (see Phylogenetic_Analysis/README.md).
#
#   conda env create -f olfaction-env.yaml
#   conda activate olfactory-receptors
#
# The exact build used for the results is in olfaction-env.lock.txt (linux-64):
#
#   conda create -n olfactory-receptors --file olfaction-env.lock.txt
#
# Conda installs the CUDA build of PyTorch on a machine with an NVIDIA driver and the CPU
# build otherwise. Only Chemicals/c03_embed.py and the Model_Inputs/Embeddings/extract_*
# notebooks need a GPU.

name: olfactory-receptors

channels:
  - conda-forge

dependencies:
  - python=3.10.22

  - numpy=2.1.3
  - pandas=2.2.3
  - scipy=1.15.2
  - scikit-learn=1.6.1
  - matplotlib-base=3.10.9
  - seaborn=0.13.2
  - plotly=5.24.1
  - pyarrow=20.0.0
  - openpyxl=3.1.5

  - rdkit=2026.03.6
  - thermo=0.6.1               # Joback boiling points
  - ete4=4.3.0
  - biopython=1.88

  - pytorch=2.12.0
  - transformers=4.48.3        # MoLFormer's remote code needs transformers 4
  - umap-learn=0.5.12
  - pynndescent=0.6.0
  - numba=0.67.0

  - jupyterlab=4.6.3
  - ipykernel=7.3.0
  - nbconvert-core=7.17.1
  - nbformat=5.11.1
  - tqdm=4.70.0
  - pip

# The Model_Inputs/Embeddings/extract_* notebooks also need ESM-C:  pip install esm==3.2.1
